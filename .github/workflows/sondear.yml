name: Sondear tiendas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 herramientas/sondear2.py
      - run: |
          git config user.name bot-ofertas; git config user.email bot-ofertas@users.noreply.github.com
          git checkout --orphan sondeo; git rm -rqf --cached .; git add -f muestras
          git commit -qm sondeo; git push -f origin sondeo
