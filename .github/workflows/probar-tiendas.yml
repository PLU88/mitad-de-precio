name: Probar tiendas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p muestras
          python3 - <<'PY'
          import urllib.request, gzip, ssl, re
          UA = "Mozilla/5.0 (compatible; MitadDePrecioBot/1.0; +https://mitad-de-precio.vercel.app/)"
          laxo = ssl.create_default_context(); laxo.check_hostname = False; laxo.verify_mode = ssl.CERT_NONE
          def get(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Encoding": "gzip"}), timeout=25, context=laxo)
                  b = r.read(); b = gzip.decompress(b) if b[:2] == b"\x1f\x8b" else b
                  return r.status, r.geturl(), b.decode("utf-8", "replace")
              except urllib.error.HTTPError as e: return e.code, url, e.read(300).decode("utf-8","replace")
              except Exception as e: return "ERR", url, str(e)[:80]
          pruebas = {
           "col_is": "https://www.columbiachile.cl/api/io/_v/api/intelligent-search/product_search/?query=&count=3&page=1&sort=discount:desc",
           "col_legacy_www": "https://www.columbia.cl/api/catalog_system/pub/products/search?_from=0&_to=2",
           "col_home": "https://www.columbiachile.cl/",
           "abc_grid": "https://www.abc.cl/on/demandware.store/Sites-Abc-Site/default/Search-UpdateGrid?cgid=root&srule=discount-off&start=0&sz=24",
           "abc_grid_es": "https://www.abc.cl/on/demandware.store/Sites-Abc-Site/es_CL/Search-UpdateGrid?q=zapatillas&start=0&sz=24",
           "abc_search": "https://www.abc.cl/search?q=zapatillas",
          }
          for k, u in pruebas.items():
              c, f, b = get(u)
              open(f"muestras/{k}.txt", "w").write(b)
              pist = {p: len(re.findall(p, b)) for p in ["data-pid","product-tile","data-gtm","gtmselectitem","price","strike","srule=","Sites-"]}
              print(f"{k:15} {c} {f[:70]} len={len(b)} {pist} | {b[:160].replace(chr(10),' ')}")
          PY
          git config user.name bot-ofertas; git config user.email bot-ofertas@users.noreply.github.com
          git checkout -b muestras2; git add -f muestras; git commit -qm muestras; git push -f origin muestras2
