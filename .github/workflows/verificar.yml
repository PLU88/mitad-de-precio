name: Verificar enlaces
on:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, gzip, re
          NAV = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for u in open("herramientas/urls_prueba.txt").read().split():
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": NAV, "Accept-Encoding": "gzip", "Referer": "https://mitad-de-precio.vercel.app/"}), timeout=25)
                  b = r.read(); b = gzip.decompress(b) if b[:2] == b"\x1f\x8b" else b
                  t = re.search(rb"<title[^>]*>(.*?)</title>", b, re.S)
                  print("RES", r.status, r.headers.get("content-type","")[:20], "| final:", r.geturl()[:90], "| titulo:", (t.group(1).decode("utf-8","replace").strip()[:60] if t else ""))
              except urllib.error.HTTPError as e: print("RES", e.code, u[:90])
              except Exception as e: print("RES ERR", u[:90], str(e)[:60])
          PY
