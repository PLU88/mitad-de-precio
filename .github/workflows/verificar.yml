name: Verificar sitio
on:
  workflow_dispatch:
    inputs:
      clave:
        description: clave
        required: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLAVE: ${{ inputs.clave }}
        run: |
          echo "::add-mask::$CLAVE"
          S=https://mitad-de-precio.vercel.app; M=/tmp/m.txt; A=/tmp/a.txt; J='Content-Type: application/json'; E=prueba-bot@mitad.test
          curl -s -H "$J" -d "{\"accion\":\"solicitar\",\"nombre\":\"Prueba\",\"email\":\"$E\"}" $S/api/sesion > /dev/null
          curl -s -c $A -H "$J" -d "{\"accion\":\"entrar\",\"clave\":\"$CLAVE\"}" $S/api/admin > /dev/null
          COD=$(curl -s -b $A -H "$J" -d "{\"accion\":\"aprobar\",\"email\":\"$E\"}" $S/api/admin | python3 -c "import json,sys;print(json.load(sys.stdin).get('codigo',''))")
          curl -s -c $M -H "$J" -d "{\"accion\":\"ingresar\",\"email\":\"$E\",\"codigo\":\"$COD\"}" $S/api/sesion > /dev/null
          curl -s --compressed -b $M -o /tmp/o.json -w "RESULTADO ofertas: %{http_code} tamaño=%{size_download}\n" $S/api/ofertas
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('RESULTADO total', d.get('total'), d.get('actualizado'), d.get('error',''))"
          curl -s -b $A -H "$J" -d "{\"accion\":\"borrar\",\"email\":\"$E\"}" $S/api/admin > /dev/null; echo "RESULTADO prueba borrada"
      - run: |
          python3 - <<'PY'
          import urllib.request, gzip, re, json
          for u in ["https://www.sodimac.cl/sodimac-cl/search?Ntt=taladro&f.range.derived.variant.discount=50%25+dcto+y+m%C3%A1s&page=1",
                    "https://www.sodimac.cl/sodimac-cl/search?Ntt=taladro"]:
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0 (compatible; MitadDePrecioBot/1.0)","Accept-Encoding":"gzip"}), timeout=30)
              b = r.read(); b = gzip.decompress(b) if b[:2]==b"\x1f\x8b" else b; h=b.decode("utf-8","replace")
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
              pp = json.loads(m.group(1))["props"]["pageProps"] if m else {}
              res = pp.get("results") or []
              print("RESULTADO sodimac", r.geturl()[:150], "resultados", len(res), "facetas aplicadas", json.dumps(pp.get("appliedFacets"), ensure_ascii=False)[:200])
              if res: print("RESULTADO  ejemplo", json.dumps(res[0].get("prices"), ensure_ascii=False)[:300])
          PY
