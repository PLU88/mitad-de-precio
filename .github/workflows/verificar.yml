name: Verificar sitio
on:
  workflow_dispatch:
    inputs:
      clave:
        description: clave
        required: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLAVE: ${{ inputs.clave }}
        run: |
          echo "::add-mask::$CLAVE"
          S=https://mitad-de-precio.vercel.app; M=/tmp/m.txt; A=/tmp/a.txt; J='Content-Type: application/json'
          echo "1 portada: $(curl -s -o /tmp/i.html -w '%{http_code}' $S/) pedir-acceso=$(grep -c 'Pedir acceso' /tmp/i.html)"
          echo "  admin.html: $(curl -s -o /dev/null -w '%{http_code}' $S/admin.html)"
          echo "  ofertas sin sesión: $(curl -s -o /dev/null -w '%{http_code}' $S/api/ofertas)"
          echo "2 solicitar: $(curl -s -H "$J" -d '{"accion":"solicitar","nombre":"Prueba Automática","email":"prueba-bot@mitad.test","whatsapp":"912345678"}' $S/api/sesion)"
          echo "  repetir: $(curl -s -H "$J" -d '{"accion":"solicitar","nombre":"Prueba Automática","email":"prueba-bot@mitad.test"}' $S/api/sesion)"
          echo "3 admin clave mala: $(curl -s -H "$J" -d '{"accion":"entrar","clave":"x"}' $S/api/admin)"
          curl -s -c $A -H "$J" -d "{\"accion\":\"entrar\",\"clave\":\"$CLAVE\"}" $S/api/admin > /tmp/e.json; echo "  admin entrar: $(cat /tmp/e.json)"
          echo "  listar: $(curl -s -b $A -H "$J" -d '{"accion":"listar"}' $S/api/admin | head -c 200)"
          COD=$(curl -s -b $A -H "$J" -d '{"accion":"aprobar","email":"prueba-bot@mitad.test"}' $S/api/admin | python3 -c "import json,sys;print(json.load(sys.stdin).get('codigo',''))")
          echo "  código generado: ${#COD} caracteres"
          echo "4 ingresar: $(curl -s -c $M -H "$J" -d "{\"accion\":\"ingresar\",\"email\":\"prueba-bot@mitad.test\",\"codigo\":\"$COD\"}" $S/api/sesion)"
          echo "  sesión: $(curl -s -b $M $S/api/sesion)"
          curl -s -b $M -o /tmp/o.json -w "  ofertas con sesión: %{http_code}\n" $S/api/ofertas
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('  total', d.get('total'), d.get('actualizado'), d.get('error',''))"
          grep -i "max-age" <(curl -s -D - -o /dev/null -c /tmp/x -H "$J" -d "{\"accion\":\"ingresar\",\"email\":\"prueba-bot@mitad.test\",\"codigo\":\"$COD\"}" $S/api/sesion) | sed 's/mdp_sesion=[^;]*/mdp_sesion=…/'
          echo "5 quitar: $(curl -s -b $A -H "$J" -d '{"accion":"quitar","email":"prueba-bot@mitad.test"}' $S/api/admin | head -c 80)"
          echo "  ofertas tras quitar: $(curl -s -b $M -o /dev/null -w '%{http_code}' $S/api/ofertas)"
          echo "  borrar: $(curl -s -b $A -H "$J" -d '{"accion":"borrar","email":"prueba-bot@mitad.test"}' $S/api/admin)"
