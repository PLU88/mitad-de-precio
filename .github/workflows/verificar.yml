name: Verificar sitio
on:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o /tmp/o.json https://raw.githubusercontent.com/PLU88/mitad-de-precio/main/docs/ofertas.json
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for T in Hites "Under Armour" Crocs; do
            IMG=$(python3 -c "import json,sys;d=json.load(open('/tmp/o.json'));print(next(o['imagen'] for o in d['ofertas'] if o['tienda']==sys.argv[1]))" "$T")
            echo "$T sin-referer: $(curl -sS -o /dev/null -w '%{http_code} %{content_type}' -A "$UA" "$IMG")"
            echo "$T con-referer: $(curl -sS -o /dev/null -w '%{http_code} %{content_type}' -A "$UA" -H 'Referer: https://mitad-de-precio.vercel.app/' "$IMG")"
          done
