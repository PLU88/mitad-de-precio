name: Diagnóstico de tiendas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python herramientas/diagnostico2.py
      - name: Guardar muestras en la rama diagnostico
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git checkout -b diagnostico
          git add -f muestras
          git commit -qm "Muestras de diagnóstico" || true
          git push -f origin diagnostico
