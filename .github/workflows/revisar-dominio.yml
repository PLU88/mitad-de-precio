name: Revisión temporal del dominio
on: workflow_dispatch
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in priveofertazos.cl www.priveofertazos.cl; do
            echo "== $d"; dig +short A $d @8.8.8.8; dig +short A $d @ns1.vercel-dns.com
            curl -sS -m 20 -o /dev/null -w "https %{http_code} -> %{redirect_url}\n" https://$d/ || true
            curl -sS -m 20 https://$d/api/sesion || true; echo
            curl -sS -m 20 https://$d/ | grep -o "<title>[^<]*</title>" || true
          done
