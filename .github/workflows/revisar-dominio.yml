name: Revisión temporal del dominio
on: workflow_dispatch
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- vercel"; dig A priveofertazos.cl @ns1.vercel-dns.com +noall +answer +comments | grep -E "status|IN"
          echo "--- google"; dig A priveofertazos.cl @8.8.8.8 +noall +answer +comments | grep -E "status|IN"
          dig A www.priveofertazos.cl @8.8.8.8 +noall +answer +comments | grep -E "status|IN"
          curl -sS -m 20 -o /dev/null -w "https %{http_code}\n" https://priveofertazos.cl/ || true
