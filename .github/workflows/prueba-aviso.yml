name: Prueba temporal del panel
on:
  workflow_dispatch:
    inputs:
      clave: { description: "clave", required: true }
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://priveofertazos.cl
          curl -sS -o /dev/null -w "inicio %{http_code}\n" $S/
          curl -sS $S/ | grep -o 'Pedir acceso por Instagram' | head -1
          curl -sS $S/admin.html | grep -o 'Agregar a alguien a mano' | head -1
          curl -sS -c c.txt -X POST $S/api/admin -H 'Content-Type: application/json' -d "{\"accion\":\"entrar\",\"clave\":\"${{ inputs.clave }}\"}" -o /dev/null -w "entrar %{http_code}\n"
          curl -sS -b c.txt -X POST $S/api/admin -H 'Content-Type: application/json' -d '{"accion":"agregar","nombre":"Prueba del panel","email":"prueba-panel@priveofertazos.cl"}' | sed 's/"codigo":"[^"]*"/"codigo":"(oculto)"/'; echo
          curl -sS -b c.txt -X POST $S/api/admin -H 'Content-Type: application/json' -d '{"accion":"borrar","email":"prueba-panel@priveofertazos.cl"}'; echo
