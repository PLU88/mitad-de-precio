name: Sondeo temporal iO
on: workflow_dispatch
jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 herramientas/sondeo_io.py
      - run: python3 herramientas/sondear.py herramientas/dominios_nuevos.txt && python3 -c "import json;print(json.dumps(json.load(open('muestras/sondeo.json')),ensure_ascii=False,indent=1)[:12000])"
