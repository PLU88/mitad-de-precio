name: Actualizar ofertas

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cifrado
        run: pip install "cryptography>=42"
      - name: Recolectar ofertas
        run: python recolector/recolectar.py
      - name: Cifrar ofertas
        run: python recolector/cifrar.py
      - name: Guardar resultados
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add datos/ofertas.enc datos/estado.json datos/historial.json
          git diff --staged --quiet || git commit -m "Ofertas actualizadas"
          git push
